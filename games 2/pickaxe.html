<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Майнинг</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;pointer-events:none;text-shadow:0 2px 6px #000b}
#tier{font-size:15px;font-weight:700;min-height:18px}
#hp{width:60%;max-width:260px;height:12px;margin:6px auto;background:#0008;border-radius:6px;overflow:hidden;visibility:hidden}
#hpf{height:100%;width:100%;background:#4ade80;transition:width .15s}
#win{font-size:30px;font-weight:800;min-height:36px}
#msg{font-size:18px;font-weight:700;margin-top:4px;min-height:24px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(transparent,#000d 38%)}
#ctl{display:flex;justify-content:center;align-items:center;gap:14px;padding-top:34px}
.sm{width:60px;height:50px;border:0;border-radius:12px;background:#262033;color:#fff;font-size:30px;font-weight:700}
#spin{width:92px;height:92px;border-radius:50%;border:0;background:#15151c;color:#fff;font-size:46px;box-shadow:inset 0 0 0 4px #fff3}
button:disabled{opacity:.4}
#info{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;opacity:.95}
#info b{display:block;font-size:20px}
#menuBtn{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:3;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menuBtn">☰ Меню</button>
<div id="hud"><div id="tier"></div><div id="hp"><div id="hpf"></div></div><div id="win"></div><div id="msg"></div></div>
<div id="bar">
  <div id="ctl"><button class="sm" id="minus">−</button><button id="spin">↻</button><button class="sm" id="plus">+</button></div>
  <div id="info"><div>БАЛАНС (игровые монеты)<b id="bal"></b></div><div style="text-align:right">СТАВКА<b id="bet"></b></div></div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ===== Настройки игры (меняй цифры здесь) =====
const START_BALANCE = 1000;                         // игровые монеты, не настоящие деньги
const BETS = [1, 2, 5, 10, 25, 50, 100, 250, 500];
const TIER = [                                       // порядок = порядок улучшений на верстаке
  { n: 'Деревянная',  hp: 100, c: '#a8743c' },
  { n: 'Медная',      hp: 100, c: '#e0864f' },
  { n: 'Каменная',    hp: 150, c: '#8d9199' },
  { n: 'Золотая',     hp: 200, c: '#f5c518' },
  { n: 'Железная',    hp: 250, c: '#d8dde6' },
  { n: 'Алмазная',    hp: 400, c: '#4dd9e6' },
  { n: 'Незеритовая', hp: 500, c: '#4a3f48' }];
const MULT = { coal: 0.01, red: 0.05, gold: 0.2, dia: 1, em: 5 };            // иксы руд
const HITS = { dirt: 1, stone: 2, coal: 3, red: 4, gold: 6, dia: 10, em: 15, tnt: 1, bench: 1 };   // сколько ударов нужно, чтобы сломать блок (coal=ETH, red=TRX, gold=USDT, dia=BTC, em=TON)
const HIT_COST = 1;                                  // здоровье кирки, которое отнимает каждый удар по блоку
const G = 22, REST = .82, KICK = 3.2, MINB = 3.2, VMAX = 13, BR = .3, TS = 2;   // физика как в старой версии: гравитация, упругость отскока, случайный «пинок», минимальный отскок, макс. скорость, радиус; TS — общая скорость игры (меньше = медленнее)
const ODDS  = [0, 0, 0, 1, 1, 2, 2, 3, 3, 4, 4, 5, 6, 'x'];  // что может выпасть (номера кирок из TIER, 'x' — крестик). Чем чаще номер, тем чаще выпадает
const WEAK  = [0, 1, 'x'];                                   // если фактический RTP выше цели, выпадает только это: деревянная, медная или крестик
const STRIP = [0, 'x', 1, 2, 'x', 3, 4, 5, 6];               // порядок символов на барабане (только для вида)
const RTP_TARGET = .95, RTP_MIN_BET = 200, SPIN_DUR = 3.2;   // целевой RTP; с какой суммы ставок начинает работать контроль
const GEN = [['tnt', .003], ['bench', .005], ['em', .00288], ['dia', .00972], ['gold', .0288], ['red', .0684], ['coal', .144], ['stone', .25]];   // шанс блока на каждую клетку; остальное — земля // остальное — земля
const BOOM = 2;                                      // радиус взрыва динамита: 2 = область 5×5
const COLS = 9;
// ==============================================

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, bs, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; bs = W / COLS;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let balance = START_BALANCE;
try { const v = parseFloat(localStorage.getItem('mbal')); if (v >= 0) balance = v; } catch (e) {}
let bi = 3, bet = BETS[bi];
const r2 = n => Math.round(n * 100) / 100;
const save = () => { try { localStorage.setItem('mbal', balance); } catch (e) {} };
let stat = { bet: 0, win: 0 };                               // сколько поставлено и выиграно за всё время (на этом устройстве)
try { const v = JSON.parse(localStorage.getItem('mstat')); if (v && v.bet >= 0 && v.win >= 0) stat = v; } catch (e) {}
const saveStat = () => { try { localStorage.setItem('mstat', JSON.stringify(stat)); } catch (e) {} };
function upd() { $('bal').textContent = r2(balance); $('bet').textContent = bet; }

// ---------- звук ----------
let actx = null;
function unlock() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function tone(f, d, type, v, delay, to) {
  if (!actx) return; const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
}
const snd = {
  tick: () => tone(900, .04, 'square', .08), dig: () => tone(160, .08, 'triangle', .3, 0, 80),
  ore: () => { tone(700, .12, 'sine', .22); tone(1050, .18, 'sine', .18, .07); },
  boom: () => tone(120, .5, 'sawtooth', .3, 0, 35), end: () => tone(300, .5, 'sawtooth', .16, 0, 70),
  up: () => { tone(500, .12, 'sine', .22); tone(750, .12, 'sine', .22, .1); tone(1000, .2, 'sine', .22, .2); }
};
const hap = k => { try { tg && tg.HapticFeedback.impactOccurred(k); } catch (e) {} };

// ---------- поле ----------
let rows = {};
function rowOf(r) {
  if (!rows[r]) {
    const t = [], h = [];
    for (let c = 0; c < COLS; c++) {
      let x = Math.random(), k = 'dirt', acc = 0;
      for (const [n, p] of GEN) { acc += p; if (x < acc) { k = n; break; } }
      if (r === 0) k = 'dirt'; else if (r < 2 && k === 'bench') k = 'dirt';
      t.push(k); h.push(HITS[k]);
    }
    rows[r] = { t, h };
  }
  return rows[r];
}
const hs = (a, b, k) => { const x = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return x - Math.floor(x); };
const PAL = { dirt: ['#c4682b', '#a1511f', '#d98342'], stone: ['#8e9197', '#74777d', '#a9acb2'], dia: ['#3bc9db', '#1fa3b5', '#8ff0fb'],
  em: ['#2fbf5a', '#1b8c3f', '#7df59d'], tnt: ['#d63a2f', '#a82a22', '#f0675c'], bench: ['#9c6b3a', '#6e4824', '#b98550'] };
const ORE = { coal: '#222', red: '#e03232', gold: '#f5c518' };
const poly = (x, y, s, pts, fill) => { ctx.beginPath(); pts.forEach(([u, v], i) => i ? ctx.lineTo(x + u * s, y + v * s) : ctx.moveTo(x + u * s, y + v * s)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
const tile = (x, y, s, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, s, s); };
const LOGO = {                                       // «руды» нарисованы как логотипы монет
  coal(x, y, s) { tile(x, y, s, '#627eea');            // Ethereum
    poly(x, y, s, [[.5, .1], [.25, .5], [.5, .62], [.75, .5]], '#eef1ff'); poly(x, y, s, [[.5, .1], [.5, .62], [.75, .5]], '#c3cdf8');
    poly(x, y, s, [[.5, .7], [.25, .55], [.5, .9], [.75, .55]], '#dfe5ff'); },
  red(x, y, s) { tile(x, y, s, '#8f2c3d');             // Tron
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, s * .06); ctx.lineJoin = 'round'; ctx.beginPath();
    ctx.moveTo(x + .2 * s, y + .22 * s); ctx.lineTo(x + .82 * s, y + .32 * s); ctx.lineTo(x + .5 * s, y + .84 * s); ctx.closePath();
    ctx.moveTo(x + .2 * s, y + .22 * s); ctx.lineTo(x + .55 * s, y + .55 * s); ctx.lineTo(x + .82 * s, y + .32 * s);
    ctx.moveTo(x + .55 * s, y + .55 * s); ctx.lineTo(x + .5 * s, y + .84 * s); ctx.stroke(); },
  gold(x, y, s) { tile(x, y, s, '#26a17b');            // Tether
    ctx.fillStyle = '#fff'; ctx.fillRect(x + .2 * s, y + .2 * s, .6 * s, .14 * s); ctx.fillRect(x + .43 * s, y + .3 * s, .14 * s, .5 * s);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, s * .05); ctx.beginPath(); ctx.ellipse(x + .5 * s, y + .47 * s, .3 * s, .08 * s, 0, 0, 7); ctx.stroke(); },
  dia(x, y, s) { tile(x, y, s, '#f7a600');             // Bitcoin
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, s * .05); ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s * .4, 0, 7); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${s * .6}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('B', x + s / 2, y + s * .53);
    [.42, .54].forEach(u => { ctx.fillRect(x + s * u, y + s * .16, s * .04, s * .12); ctx.fillRect(x + s * u, y + s * .72, s * .04, s * .12); }); },
  em(x, y, s) { tile(x, y, s, '#2b9dff');              // TON
    poly(x, y, s, [[.16, .3], [.3, .16], [.7, .16], [.84, .3], [.5, .84]], '#fff');
    poly(x, y, s, [[.5, .3], [.54, .4], [.64, .44], [.54, .48], [.5, .6], [.46, .48], [.36, .44], [.46, .4]], '#2b9dff'); }
};
function drawBlock(x, y, s, t, r, c, hl) {
  const P = s / 7, p = PAL[ORE[t] ? 'stone' : t];
  ctx.fillStyle = p[0]; ctx.fillRect(x, y, s, s);
  for (let k = 0; k < 7; k++) { ctx.fillStyle = p[1 + (k & 1)]; ctx.fillRect(x + Math.floor(hs(r, c, k) * 6) * P, y + Math.floor(hs(r, c, k + 9) * 6) * P, P, P); }
  if (ORE[t]) { ctx.fillStyle = ORE[t]; for (let k = 0; k < 5; k++) ctx.fillRect(x + Math.floor(hs(r, c, k + 20) * 5 + .5) * P + P / 2, y + Math.floor(hs(r, c, k + 30) * 5 + .5) * P + P / 2, P * 1.4, P * 1.4); }
  if (t === 'tnt') { ctx.fillStyle = '#eee'; ctx.fillRect(x, y + s * .38, s, s * .24); ctx.fillStyle = '#222'; ctx.font = `bold ${s * .22}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('TNT', x + s / 2, y + s / 2); }
  if (t === 'bench') { ctx.strokeStyle = '#4b2f16'; ctx.lineWidth = 2; ctx.strokeRect(x + s * .15, y + s * .15, s * .7, s * .7); ctx.beginPath(); ctx.moveTo(x + s / 2, y + s * .15); ctx.lineTo(x + s / 2, y + s * .85); ctx.moveTo(x + s * .15, y + s / 2); ctx.lineTo(x + s * .85, y + s / 2); ctx.stroke(); }
  if (LOGO[t]) LOGO[t](x, y, s);
  if (r === 0) { ctx.fillStyle = '#2e7d32'; ctx.fillRect(x, y, s, s * .22); ctx.fillStyle = '#43a047'; ctx.fillRect(x, y, s, s * .08); }
  if (hl !== undefined && hl < HITS[t]) {
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < HITS[t] - hl; i++) { const o = (i * .37) % 1; ctx.moveTo(x + s * (.1 + o * .6), y + s * .1); ctx.lineTo(x + s * (.35 + o * .4), y + s * .5); ctx.lineTo(x + s * (.2 + o * .6), y + s * .9); }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, s - 1, s - 1);
}
function drawPick(x, y, s, head, handle, rot, halo) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.lineCap = 'round';
  const headPath = () => { ctx.beginPath(); ctx.moveTo(-s * .25, -s * .95); ctx.quadraticCurveTo(s * .95, -s * .95, s * .95, s * .25); };
  const handlePath = () => { ctx.beginPath(); ctx.moveTo(-s * .7, s * .7); ctx.lineTo(s * .5, -s * .5); };
  if (halo) { ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = s * .22 + 5; handlePath(); ctx.stroke(); ctx.lineWidth = s * .3 + 5; headPath(); ctx.stroke(); }
  ctx.strokeStyle = handle; ctx.lineWidth = s * .22; handlePath(); ctx.stroke();
  ctx.strokeStyle = head; ctx.lineWidth = s * .3; headPath(); ctx.stroke();
  ctx.restore();
}

// ---------- состояние ----------
let state = 'idle', tier = 0, hp = 0, mult = 0, bx = COLS / 2, by = -2.5, vx = 0, vy = 0, ang = 0, life = 0, mined = false;
let turbo = 1, reelP = 0, reel0 = 0, reel1 = 0, spinT = 0, result = 0, showWheel = true, wheelA = 1, cam = -H * .58;
let parts = [], texts = [], fx = [];
let msgT; function say(t, ms) { $('msg').textContent = t; clearTimeout(msgT); if (ms) msgT = setTimeout(() => $('msg').textContent = '', ms); }
function btns(on) { ['spin', 'minus', 'plus', 'menuBtn'].forEach(i => $(i).disabled = !on); }
function hud() {
  $('tier').textContent = mined ? `${TIER[tier].n} кирка · ${Math.max(0, Math.round(hp))}/${TIER[tier].hp}` : 'МАЙНИНГ';
  $('hp').style.visibility = mined ? 'visible' : 'hidden';
  $('hpf').style.width = mined ? (100 * hp / TIER[tier].hp) + '%' : '100%';
  $('hpf').style.background = hp / TIER[tier].hp > .35 ? '#4ade80' : '#f87171';
  $('win').textContent = mined || mult ? `×${mult.toFixed(2)} · +${r2(bet * mult)}` : '';
}

$('minus').onclick = () => { if (state === 'idle') { bi = Math.max(0, bi - 1); bet = BETS[bi]; upd(); } };
$('plus').onclick = () => { if (state === 'idle') { bi = Math.min(BETS.length - 1, bi + 1); bet = BETS[bi]; upd(); } };
function pickResult() {
  if (stat.bet >= RTP_MIN_BET && stat.win / stat.bet > RTP_TARGET) return WEAK[Math.floor(Math.random() * WEAK.length)];   // RTP выше цели → слабая кирка или крестик
  return ODDS[Math.floor(Math.random() * ODDS.length)];
}
$('spin').onclick = () => {
  unlock(); if (state !== 'idle') return;
  if (balance < bet) { say('Недостаточно монет — уменьши ставку', 1800); return; }
  balance = r2(balance - bet); save(); stat.bet += bet; saveStat(); upd(); say('');
  result = pickResult();
  const idxs = []; STRIP.forEach((v, i) => { if (v === result) idxs.push(i); });
  const idx = idxs[Math.floor(Math.random() * idxs.length)], N = STRIP.length;
  reel0 = reelP; const base = Math.ceil(reel0);
  reel1 = base + N * 5 + (((idx - base) % N) + N) % N;
  spinT = 0; state = 'spin'; mined = false; mult = 0; hud(); btns(false);
};

function spinDone() {
  if (result === 'x') {
    state = 'end'; say('✖ Крестик! Ставка сгорела', 2200); snd.end(); hap('heavy');
    setTimeout(toIdle, 2300); return;
  }
  tier = result; hp = TIER[tier].hp; mult = 0; bx = COLS / 2 + (Math.random() - .5) * 2; by = -2.5; vx = (Math.random() - .5) * 5; vy = 0; life = 0; turbo = 1; state = 'pre';
  say(TIER[tier].n + ' кирка!', 900); snd.up();
  setTimeout(() => { state = 'mine'; mined = true; showWheel = false; say('Нажимай на экран: скорость ×1 / ×2 / ×4 / ×8', 3500); hud(); }, 900);
}
function toIdle() {
  state = 'idle'; mined = false; rows = {}; cam = -H * .58; bx = COLS / 2; by = -2.5; showWheel = true; parts = []; texts = []; fx = [];
  if (balance < 1) { balance = START_BALANCE; save(); say('Бонус: +' + START_BALANCE + ' монет', 2500); }
  upd(); hud(); btns(true);
}

function floatText(c, r, txt, col) { texts.push({ x: (c + .5) * bs, y: r * bs + bs / 2, txt, col, t: 0 }); }
function burst(c, r, t) {
  const col = (PAL[ORE[t] ? 'stone' : t] || PAL.dirt)[0];
  for (let i = 0; i < 6; i++) parts.push({ x: (c + .5) * bs, y: (r + .5) * bs, vx: (Math.random() - .5) * 220, vy: -Math.random() * 180, t: 0, col, s: bs / 7 });
}
function collect(b, r, c) {
  if (!b) return;
  if (MULT[b]) { mult = Math.round((mult + MULT[b]) * 1000) / 1000; floatText(c, r, '×' + MULT[b], b === 'em' ? '#7df59d' : b === 'dia' ? '#8ff0fb' : '#ffe066'); snd.ore(); hap('light'); }
  if (b === 'bench') { if (tier < TIER.length - 1) tier++; hp = TIER[tier].hp; floatText(c, r, '⬆ ' + TIER[tier].n, '#fff'); snd.up(); hap('medium'); }
  if (b === 'tnt') boom(r, c);
}
function boom(r, c) {
  fx.push({ x: (c + .5) * bs, y: (r + .5) * bs, t: 0 }); snd.boom(); hap('heavy');
  for (let dr = -BOOM; dr <= BOOM; dr++) for (let dc = -BOOM; dc <= BOOM; dc++) {
    const rr = r + dr, cc = c + dc; if ((!dr && !dc) || cc < 0 || cc >= COLS || rr < 0) continue;
    const rw = rowOf(rr), b = rw.t[cc]; if (!b) continue;
    rw.t[cc] = null; burst(cc, rr, b);
    if (b !== 'bench') collect(b, rr, cc);       // верстак от взрыва просто разрушается, улучшения нет
  }
}
function hitCell(x, y) {
  for (let r = Math.floor(y - BR); r <= Math.floor(y + BR); r++) for (let c = Math.floor(x - BR); c <= Math.floor(x + BR); c++) {
    if (c < 0 || c >= COLS || r < 0 || rowOf(r).t[c] === null) continue;
    const px = Math.max(c, Math.min(x, c + 1)), py = Math.max(r, Math.min(y, r + 1));
    if ((x - px) * (x - px) + (y - py) * (y - py) < BR * BR) return [c, r];
  }
  return null;
}
function strike(c, r) {                       // удар кирки по блоку
  const rw = rowOf(r), t = rw.t[c]; if (!t) return;
  hp -= HIT_COST; rw.h[c]--; snd.dig(); burst(c, r, t);
  if (rw.h[c] <= 0) { rw.t[c] = null; collect(t, r, c); }
  if (hp <= 0 && state === 'mine') { hp = 0; finish(); }
  hud();
}
function physics(dt) {
  dt *= TS * turbo;                                    // ускорение игры
  const n = Math.max(1, Math.ceil(Math.hypot(vx, vy) * dt / .06)), h = dt / n;
  for (let i = 0; i < n && state === 'mine'; i++) {
    bx += vx * h;
    if (bx < BR) { bx = BR; vx = Math.abs(vx); } if (bx > COLS - BR) { bx = COLS - BR; vx = -Math.abs(vx); }
    let k = hitCell(bx, by);
    if (k) {                                   // боковой рикошет
      bx -= vx * h; vx = -vx * REST; vy += (Math.random() - .5) * KICK;
      if (Math.abs(vx) < 1.5) vx = (Math.random() < .5 ? -1 : 1) * (1.5 + Math.random() * 2);
      strike(k[0], k[1]);
    }
    vy += G * h; by += vy * h; k = hitCell(bx, by);
    if (k && state === 'mine') {               // вертикальный рикошет
      by -= vy * h; vy = -vy * REST; vx += (Math.random() - .5) * KICK;
      if (vy < 0 && vy > -MINB) vy = -MINB;
      strike(k[0], k[1]);
    }
    vx = Math.max(-VMAX, Math.min(VMAX, vx)); vy = Math.max(-VMAX, Math.min(VMAX, vy));
  }
  ang += vx * dt * .8; life += dt; if (life > 900 && state === 'mine') finish();
}
function finish() {
  state = 'end'; const win = r2(bet * mult); balance = r2(balance + win); save(); stat.win += win; saveStat(); upd(); snd.end();
  say(win > 0 ? `Кирка сломалась! Выигрыш: +${win}` : 'Кирка сломалась… ничего не добыто', 2400);
  setTimeout(toIdle, 2500);
}

cv.addEventListener('pointerdown', () => { unlock(); if (state === 'mine') { turbo = turbo === 1 ? 2 : turbo === 2 ? 4 : turbo === 4 ? 8 : 1; say('Скорость ×' + turbo, 900); } });

// ---------- рисование ----------
const STARS = Array.from({ length: 70 }, (_, i) => [hs(i, 1, 1), hs(i, 2, 2) * .6, 1 + hs(i, 3, 3) * 1.6]);
function drawSky() {                                         // ночь: тёмный градиент, звёзды, луна
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#050816'); g.addColorStop(.55, '#12183f'); g.addColorStop(1, '#262a63');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const tm = performance.now() / 1000;
  STARS.forEach(([u, v, r], i) => { ctx.globalAlpha = .45 + .5 * Math.sin(tm * 1.3 + i); ctx.fillStyle = '#fff'; ctx.fillRect(u * W, v * H, r, r); }); ctx.globalAlpha = 1;
  const mx = W * .8, my = H * .12, mr = Math.min(W * .075, 34);
  const mg = ctx.createRadialGradient(mx, my, mr * .6, mx, my, mr * 3); mg.addColorStop(0, 'rgba(255,248,200,.35)'); mg.addColorStop(1, 'rgba(255,248,200,0)');
  ctx.fillStyle = mg; ctx.fillRect(mx - mr * 3, my - mr * 3, mr * 6, mr * 6);
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fillStyle = '#f4f1d6'; ctx.fill();
  ctx.fillStyle = 'rgba(190,185,150,.5)'; [[-.3, -.2, .22], [.25, .1, .18], [-.1, .4, .14]].forEach(([u, v, k]) => { ctx.beginPath(); ctx.arc(mx + u * mr, my + v * mr, k * mr, 0, 7); ctx.fill(); });
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function symbol(k, x, y, w, h) {
  rr(x - w / 2 + 5, y - h / 2 + 5, w - 10, h - 10, 12); ctx.fillStyle = k === 'x' ? '#8c1d1d' : TIER[k].c; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
  if (k === 'x') { const d = h * .2; ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); ctx.moveTo(x + d, y - d); ctx.lineTo(x - d, y + d); ctx.stroke(); }
  else { ctx.save(); ctx.translate(x, y); drawPick(0, 0, h * .27, k === 6 ? '#d9d0d6' : '#1d1d2b', k === 6 ? '#aaa' : '#3b2a1a', 0); ctx.restore(); }
}
function drawWheel() {                                        // рисует слот-машину
  if (wheelA < .02) return;
  const cx = W / 2, cy = H * .34, ch = Math.min(W * .2, H * .1), cw = ch * 1.9, N = STRIP.length;
  const wx = cx - cw / 2, wy = cy - ch * 1.5, fy0 = wy - 46, fy1 = wy + ch * 3 + 24;
  ctx.save(); ctx.globalAlpha = wheelA;
  rr(wx - 22, fy0, cw + 44, fy1 - fy0, 22); ctx.fillStyle = '#2b2140'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#e8b923'; ctx.stroke();
  ctx.fillStyle = '#ffd34d'; ctx.font = `800 ${ch * .26}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⛏ МАЙНИНГ', cx, fy0 + 23);
  const tm = Math.floor(performance.now() / 280);
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(wx - 6 + (cw + 12) * i / 8, fy1 - 11, 4.5, 0, 7); ctx.fillStyle = (i + tm) % 2 ? '#ffe27a' : '#a67c00'; ctx.fill(); }
  rr(wx - 4, wy - 4, cw + 8, ch * 3 + 8, 10); ctx.fillStyle = '#120d1e'; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, cw, ch * 3); ctx.clip();
  const fl = Math.floor(reelP), fr = reelP - fl;
  for (let j = -2; j <= 2; j++) symbol(STRIP[(((fl + j) % N) + N) % N], cx, cy + (j - fr) * ch, cw, ch);
  const g = ctx.createLinearGradient(0, wy, 0, wy + ch * 3); g.addColorStop(0, 'rgba(10,6,20,.85)'); g.addColorStop(.3, 'rgba(10,6,20,0)'); g.addColorStop(.7, 'rgba(10,6,20,0)'); g.addColorStop(1, 'rgba(10,6,20,.85)');
  ctx.fillStyle = g; ctx.fillRect(wx, wy, cw, ch * 3);
  ctx.restore();
  ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.moveTo(wx - 16, cy - 10); ctx.lineTo(wx - 2, cy); ctx.lineTo(wx - 16, cy + 10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(wx + cw + 16, cy - 10); ctx.lineTo(wx + cw + 2, cy); ctx.lineTo(wx + cw + 16, cy + 10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,77,77,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx, cy - ch / 2 + 4); ctx.lineTo(wx + cw, cy - ch / 2 + 4); ctx.moveTo(wx, cy + ch / 2 - 4); ctx.lineTo(wx + cw, cy + ch / 2 - 4); ctx.stroke();
  ctx.restore();
}
function draw() {
  drawSky();
  const r0 = Math.max(0, Math.floor(cam / bs) - 1), r1 = Math.ceil((cam + H) / bs);
  for (let r = r0; r <= r1; r++) {
    const rw = rowOf(r), y = r * bs - cam;
    for (let c = 0; c < COLS; c++) { if (rw.t[c]) drawBlock(c * bs, y, bs, rw.t[c], r, c, rw.h[c]); else { ctx.fillStyle = '#120b10'; ctx.fillRect(c * bs, y, bs + .5, bs + .5); } }
  }
  { const gy = Math.max(0, -cam); ctx.fillStyle = 'rgba(8,10,35,.25)'; ctx.fillRect(0, gy, W, H - gy); }   // ночное затемнение земли
  if (mined && state !== 'end') drawPickAt(bx * bs, by * bs - cam, bs * .42, TIER[tier].c, ang);
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, 1 - p.t * 1.6); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y - cam, p.s, p.s); }); ctx.globalAlpha = 1;
  fx.forEach(f => { ctx.globalAlpha = Math.max(0, 1 - f.t * 2); ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(f.x, f.y - cam, bs * (.8 + f.t * 3.6), 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `800 ${bs * .34}px sans-serif`;
  texts.forEach(t => { ctx.globalAlpha = Math.max(0, 1 - t.t * .8); ctx.lineWidth = 4; ctx.strokeStyle = '#000a'; ctx.fillStyle = t.col; const y = t.y - cam - t.t * 50; ctx.strokeText(t.txt, t.x, y); ctx.fillText(t.txt, t.x, y); }); ctx.globalAlpha = 1;
  drawWheel();
}
function drawPickAt(x, y, s, col, rot) { drawPick(x, y, s, col, '#6b4423', rot, true); }

let last = performance.now();
function update(dt) {
  if (state === 'spin') {
    spinT += dt; const t = Math.min(1, spinT / SPIN_DUR), c1 = 1.2, u = t - 1;
    const np = reel0 + (reel1 - reel0) * (1 + (c1 + 1) * u * u * u + c1 * u * u);   // торможение с небольшим «отскоком»
    if (Math.floor(np) !== Math.floor(reelP)) snd.tick(); reelP = np;
    if (t >= 1) { reelP = reel1 % STRIP.length; spinDone(); }
  }
  if (state === 'mine') physics(dt);
  wheelA += ((showWheel ? 1 : 0) - wheelA) * Math.min(1, dt * 5);
  const tgt = mined ? by * bs - H * .36 : -H * .58; cam += (tgt - cam) * Math.min(1, dt * 6);
  parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.vy += 600 * dt; p.y += p.vy * dt; }); parts = parts.filter(p => p.t < .7);
  fx.forEach(f => f.t += dt); fx = fx.filter(f => f.t < .5);
  texts.forEach(t => t.t += dt); texts = texts.filter(t => t.t < 1.2);
}
function frame(now) { const dt = Math.min((now - last) / 1000, .05); last = now; update(dt); draw(); requestAnimationFrame(frame); }
const toMenu = () => { if (state === 'idle') location.href = 'index.html'; };   // во время раунда выходить нельзя
$('menuBtn').onclick = toMenu;
try { if (tg) { tg.BackButton.show(); tg.BackButton.onClick(toMenu); } } catch (e) {}
upd(); hud(); requestAnimationFrame(frame);
</script>
