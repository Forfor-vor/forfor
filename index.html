<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;min-height:100%;background:#12141f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{box-sizing:border-box;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 64px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:520px;margin:0 auto}
h1{margin:0 0 4px;font-size:32px}
.sub{margin:0 0 22px;opacity:.65}
.card{display:block;width:100%;border:0;border-radius:22px;padding:0;margin-bottom:16px;color:#fff;text-align:left;overflow:hidden;box-shadow:0 8px 24px #0007;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.card:active{transform:scale(.97)}
.art{height:132px;display:flex;align-items:flex-end;justify-content:center}
.txt{padding:14px 18px 16px;background:rgba(0,0,0,.3)}
.txt b{display:block;font-size:21px}
.txt span{font-size:14px;opacity:.9}
#c1{background:linear-gradient(135deg,#ff9a9a,#ff5f8d)}
#c2{background:linear-gradient(135deg,#0b1030,#2b2f6b)}
.st{display:flex;flex-direction:column;align-items:center}
.st i{display:block;height:20px;border-radius:3px;box-shadow:inset 0 -4px 0 #0003,inset 0 3px 0 #fff4}
.ore{display:flex;align-items:flex-end;gap:6px;margin-bottom:8px}
.ore i{display:block;width:28px;height:34px;border-radius:4px;box-shadow:inset 0 -5px 0 #0003,inset 0 4px 0 #fff4}
.pk{font-size:54px;margin-right:12px;line-height:1}
.note{margin-top:8px;font-size:12px;opacity:.5;text-align:center}
#c3{background:linear-gradient(135deg,#050505,#2f6b00)}
.duel{display:flex;align-items:center;gap:14px;font-size:46px;margin-bottom:12px}
</style>
</head>
<body>
<h1>🎮 Игры</h1>
<p class="sub">Выбери игру</p>

<button class="card" id="c1" onclick="go('stack.html')">
  <div class="art"><div class="st">
    <i style="width:70px;background:#e8503a"></i><i style="width:96px;background:#e8803a"></i>
    <i style="width:84px;background:#e8c23a"></i><i style="width:110px;background:#6fcf4a"></i>
    <i style="width:100px;background:#3ac2e8"></i><i style="width:124px;background:#6a6ae8"></i>
  </div></div>
  <div class="txt"><b>Stack Block 3D</b><span id="s1"></span></div>
</button>

<button class="card" id="c2" onclick="go('pickaxe.html')">
  <div class="art"><div class="pk">⛏️</div><div class="ore"><i style="background:#627eea"></i><i style="background:#8f2c3d"></i><i style="background:#26a17b"></i><i style="background:#f7a600"></i><i style="background:#2b9dff"></i></div></div>
  <div class="txt"><b>Майнинг</b><span id="s2"></span></div>
</button>

<button class="card" id="c3" onclick="go('arena.html')">
  <div class="art"><div class="duel"><span>🧑</span><span>⚔️</span><span>🤖</span></div></div>
  <div class="txt"><b>Арена</b><span id="s3"></span></div>
</button>

<div class="note">Монеты в играх — игровые, не настоящие деньги</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.BackButton.hide(); } catch (e) {} }
function go(url) { try { tg && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} location.href = url; }
let best = 0, bal = 1000;
try { best = +localStorage.getItem('best') || 0; const b = parseFloat(localStorage.getItem('mbal')); if (b >= 0) bal = b; } catch (e) {}
document.getElementById('s1').textContent = best ? 'Твой рекорд: ' + best : 'Собери самую высокую башню';
let aw = 0; try { aw = +localStorage.getItem('awins') || 0; } catch (e) {}
document.getElementById('s3').textContent = aw ? 'Твои победы: ' + aw : 'Дуэль на мечах 1 на 1';
document.getElementById('s2').textContent = 'Баланс: ' + Math.round(bal * 100) / 100 + ' монет';
</script>
</body>
</html>
