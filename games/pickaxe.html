<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pickaxe Roulette</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#6fb7f5;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;pointer-events:none;text-shadow:0 2px 6px #000b}
#tier{font-size:15px;font-weight:700;min-height:18px}
#hp{width:60%;max-width:260px;height:12px;margin:6px auto;background:#0008;border-radius:6px;overflow:hidden;visibility:hidden}
#hpf{height:100%;width:100%;background:#4ade80;transition:width .15s}
#win{font-size:30px;font-weight:800;min-height:36px}
#msg{font-size:18px;font-weight:700;margin-top:4px;min-height:24px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(transparent,#000d 38%)}
#ctl{display:flex;justify-content:center;align-items:center;gap:14px;padding-top:34px}
.sm{width:60px;height:50px;border:0;border-radius:12px;background:#3a2a22;color:#fff;font-size:30px;font-weight:700}
#spin{width:92px;height:92px;border-radius:50%;border:0;background:#15151c;color:#fff;font-size:46px;box-shadow:inset 0 0 0 4px #fff3}
button:disabled{opacity:.4}
#info{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;opacity:.95}
#info b{display:block;font-size:20px}
#menuBtn{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:3;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menuBtn">☰ Меню</button>
<div id="hud"><div id="tier"></div><div id="hp"><div id="hpf"></div></div><div id="win"></div><div id="msg"></div></div>
<div id="bar">
  <div id="ctl"><button class="sm" id="minus">−</button><button id="spin">↻</button><button class="sm" id="plus">+</button></div>
  <div id="info"><div>БАЛАНС (игровые монеты)<b id="bal"></b></div><div style="text-align:right">СТАВКА<b id="bet"></b></div></div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ===== Настройки игры (меняй цифры здесь) =====
const START_BALANCE = 1000;                         // игровые монеты, не настоящие деньги
const BETS = [1, 2, 5, 10, 25, 50, 100, 250, 500];
const TIER = [
  { n: 'Деревянная', hp: 100, c: '#a8743c' },
  { n: 'Каменная',   hp: 150, c: '#8d9199' },
  { n: 'Железная',   hp: 250, c: '#d8dde6' },
  { n: 'Алмазная',   hp: 400, c: '#4dd9e6' }];
const MULT = { coal: 0.01, red: 0.05, gold: 0.2, dia: 1, em: 5 };            // иксы руд
const HITS = { dirt: 1, stone: 2, coal: 2, red: 3, gold: 4, dia: 6, em: 8, tnt: 1, bench: 1 };   // сколько ударов нужно, чтобы сломать блок
const HIT  = { dirt: 4, stone: 6, coal: 6, red: 8, gold: 10, dia: 14, em: 18, tnt: 4, bench: 2 };   // сколько здоровья кирки отнимает один удар
const G = 22, REST = .82, KICK = 3.2, MINB = 3.2, VMAX = 13, BR = .3, TS = 1.5;                            // физика: гравитация, упругость, случайный «пинок», радиус
const WHEEL = [0, 1, 2, 0, 'x', 1, 0, 3, 1, 0, 2];   // 0 дерево, 1 камень, 2 железо, 3 алмаз, 'x' крестик
const GEN = [['tnt', .03], ['bench', .025], ['em', .012], ['dia', .035], ['gold', .065], ['red', .08], ['coal', .10], ['stone', .25]]; // остальное — земля
const COLS = 7, SEG = 2 * Math.PI / WHEEL.length, SPIN_DUR = 3.6;
// ==============================================

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, bs, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; bs = W / COLS;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let balance = START_BALANCE;
try { const v = parseFloat(localStorage.getItem('mbal')); if (v >= 0) balance = v; } catch (e) {}
let bi = 3, bet = BETS[bi];
const r2 = n => Math.round(n * 100) / 100;
const save = () => { try { localStorage.setItem('mbal', balance); } catch (e) {} };
function upd() { $('bal').textContent = r2(balance); $('bet').textContent = bet; }

// ---------- звук ----------
let actx = null;
function unlock() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function tone(f, d, type, v, delay, to) {
  if (!actx) return; const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(v || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02);
}
const snd = {
  tick: () => tone(900, .04, 'square', .08), dig: () => tone(160, .08, 'triangle', .3, 0, 80),
  ore: () => { tone(700, .12, 'sine', .22); tone(1050, .18, 'sine', .18, .07); },
  boom: () => tone(120, .5, 'sawtooth', .3, 0, 35), end: () => tone(300, .5, 'sawtooth', .16, 0, 70),
  up: () => { tone(500, .12, 'sine', .22); tone(750, .12, 'sine', .22, .1); tone(1000, .2, 'sine', .22, .2); }
};
const hap = k => { try { tg && tg.HapticFeedback.impactOccurred(k); } catch (e) {} };

// ---------- поле ----------
let rows = {};
function rowOf(r) {
  if (!rows[r]) {
    const t = [], h = [];
    for (let c = 0; c < COLS; c++) {
      let x = Math.random(), k = 'dirt', acc = 0;
      for (const [n, p] of GEN) { acc += p; if (x < acc) { k = n; break; } }
      if (r === 0) k = 'dirt'; else if (r < 2 && k === 'bench') k = 'dirt';
      t.push(k); h.push(HITS[k]);
    }
    rows[r] = { t, h };
  }
  return rows[r];
}
const hs = (a, b, k) => { const x = Math.sin(a * 127.1 + b * 311.7 + k * 74.7) * 43758.5453; return x - Math.floor(x); };
const PAL = { dirt: ['#c4682b', '#a1511f', '#d98342'], stone: ['#8e9197', '#74777d', '#a9acb2'], dia: ['#3bc9db', '#1fa3b5', '#8ff0fb'],
  em: ['#2fbf5a', '#1b8c3f', '#7df59d'], tnt: ['#d63a2f', '#a82a22', '#f0675c'], bench: ['#9c6b3a', '#6e4824', '#b98550'] };
const ORE = { coal: '#222', red: '#e03232', gold: '#f5c518' };
function drawBlock(x, y, s, t, r, c, hl) {
  const P = s / 7, p = PAL[ORE[t] ? 'stone' : t];
  ctx.fillStyle = p[0]; ctx.fillRect(x, y, s, s);
  for (let k = 0; k < 7; k++) { ctx.fillStyle = p[1 + (k & 1)]; ctx.fillRect(x + Math.floor(hs(r, c, k) * 6) * P, y + Math.floor(hs(r, c, k + 9) * 6) * P, P, P); }
  if (ORE[t]) { ctx.fillStyle = ORE[t]; for (let k = 0; k < 5; k++) ctx.fillRect(x + Math.floor(hs(r, c, k + 20) * 5 + .5) * P + P / 2, y + Math.floor(hs(r, c, k + 30) * 5 + .5) * P + P / 2, P * 1.4, P * 1.4); }
  if (t === 'tnt') { ctx.fillStyle = '#eee'; ctx.fillRect(x, y + s * .38, s, s * .24); ctx.fillStyle = '#222'; ctx.font = `bold ${s * .22}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('TNT', x + s / 2, y + s / 2); }
  if (t === 'bench') { ctx.strokeStyle = '#4b2f16'; ctx.lineWidth = 2; ctx.strokeRect(x + s * .15, y + s * .15, s * .7, s * .7); ctx.beginPath(); ctx.moveTo(x + s / 2, y + s * .15); ctx.lineTo(x + s / 2, y + s * .85); ctx.moveTo(x + s * .15, y + s / 2); ctx.lineTo(x + s * .85, y + s / 2); ctx.stroke(); }
  if (r === 0) { ctx.fillStyle = '#5dbb2f'; ctx.fillRect(x, y, s, s * .22); ctx.fillStyle = '#7ed957'; ctx.fillRect(x, y, s, s * .08); }
  if (hl !== undefined && hl < HITS[t]) {
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < HITS[t] - hl; i++) { const o = (i * .37) % 1; ctx.moveTo(x + s * (.1 + o * .6), y + s * .1); ctx.lineTo(x + s * (.35 + o * .4), y + s * .5); ctx.lineTo(x + s * (.2 + o * .6), y + s * .9); }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, s - 1, s - 1);
}
function drawPick(x, y, s, head, handle, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.lineCap = 'round';
  ctx.strokeStyle = handle; ctx.lineWidth = s * .22; ctx.beginPath(); ctx.moveTo(-s * .7, s * .7); ctx.lineTo(s * .5, -s * .5); ctx.stroke();
  ctx.strokeStyle = head; ctx.lineWidth = s * .3; ctx.beginPath(); ctx.moveTo(-s * .25, -s * .95); ctx.quadraticCurveTo(s * .95, -s * .95, s * .95, s * .25); ctx.stroke();
  ctx.restore();
}

// ---------- состояние ----------
let state = 'idle', tier = 0, hp = 0, mult = 0, bx = 3.5, by = -2.5, vx = 0, vy = 0, ang = 0, life = 0, mined = false;
let theta = 0, th0 = 0, th1 = 0, spinT = 0, result = 0, showWheel = true, wheelA = 1, cam = -H * .58;
let parts = [], texts = [], fx = [];
let msgT; function say(t, ms) { $('msg').textContent = t; clearTimeout(msgT); if (ms) msgT = setTimeout(() => $('msg').textContent = '', ms); }
function btns(on) { ['spin', 'minus', 'plus', 'menuBtn'].forEach(i => $(i).disabled = !on); }
function hud() {
  $('tier').textContent = mined ? `${TIER[tier].n} кирка · ${Math.max(0, Math.round(hp))}/${TIER[tier].hp}` : '';
  $('hp').style.visibility = mined ? 'visible' : 'hidden';
  $('hpf').style.width = mined ? (100 * hp / TIER[tier].hp) + '%' : '100%';
  $('hpf').style.background = hp / TIER[tier].hp > .35 ? '#4ade80' : '#f87171';
  $('win').textContent = mined || mult ? `×${mult.toFixed(2)} · +${r2(bet * mult)}` : '';
}

$('minus').onclick = () => { if (state === 'idle') { bi = Math.max(0, bi - 1); bet = BETS[bi]; upd(); } };
$('plus').onclick = () => { if (state === 'idle') { bi = Math.min(BETS.length - 1, bi + 1); bet = BETS[bi]; upd(); } };
$('spin').onclick = () => {
  unlock(); if (state !== 'idle') return;
  if (balance < bet) { say('Недостаточно монет — уменьши ставку', 1800); return; }
  balance = r2(balance - bet); save(); upd(); say('');
  const k = Math.floor(Math.random() * WHEEL.length); result = WHEEL[k];
  const target = -Math.PI / 2 - (k * SEG + SEG / 2) + (Math.random() - .5) * SEG * .7;
  th0 = theta; th1 = th0 + (((target - th0) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) + 2 * Math.PI * 5;
  spinT = 0; state = 'spin'; mined = false; mult = 0; hud(); btns(false);
};

function spinDone() {
  if (result === 'x') {
    state = 'end'; say('✖ Крестик! Ставка сгорела', 2200); snd.end(); hap('heavy');
    setTimeout(toIdle, 2300); return;
  }
  tier = result; hp = TIER[tier].hp; mult = 0; bx = COLS / 2 + (Math.random() - .5) * 2; by = -2.5; vx = (Math.random() - .5) * 5; vy = 0; life = 0; state = 'pre';
  say(TIER[tier].n + ' кирка!', 900); snd.up();
  setTimeout(() => { state = 'mine'; mined = true; showWheel = false; say('Кирка летит сама — удачи!', 2500); hud(); }, 900);
}
function toIdle() {
  state = 'idle'; mined = false; rows = {}; cam = -H * .58; bx = 3.5; by = -2.5; showWheel = true; parts = []; texts = []; fx = [];
  if (balance < 1) { balance = START_BALANCE; save(); say('Бонус: +' + START_BALANCE + ' монет', 2500); }
  upd(); hud(); btns(true);
}

function floatText(c, r, txt, col) { texts.push({ x: (c + .5) * bs, y: r * bs + bs / 2, txt, col, t: 0 }); }
function burst(c, r, t) {
  const col = (PAL[ORE[t] ? 'stone' : t] || PAL.dirt)[0];
  for (let i = 0; i < 6; i++) parts.push({ x: (c + .5) * bs, y: (r + .5) * bs, vx: (Math.random() - .5) * 220, vy: -Math.random() * 180, t: 0, col, s: bs / 7 });
}
function collect(b, r, c) {
  if (!b) return;
  if (MULT[b]) { mult = Math.round((mult + MULT[b]) * 1000) / 1000; floatText(c, r, '×' + MULT[b], b === 'em' ? '#7df59d' : b === 'dia' ? '#8ff0fb' : '#ffe066'); snd.ore(); hap('light'); }
  if (b === 'bench') { if (tier < 3) tier++; hp = TIER[tier].hp; floatText(c, r, '⬆ ' + TIER[tier].n, '#fff'); snd.up(); hap('medium'); }
  if (b === 'tnt') boom(r, c);
}
function boom(r, c) {
  fx.push({ x: (c + .5) * bs, y: (r + .5) * bs, t: 0 }); snd.boom(); hap('heavy');
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const rr = r + dr, cc = c + dc; if ((!dr && !dc) || cc < 0 || cc >= COLS || rr < 0) continue;
    const rw = rowOf(rr), b = rw.t[cc]; if (b) { rw.t[cc] = null; burst(cc, rr, b); collect(b, rr, cc); }
  }
}
function hitCell(x, y) {
  for (let r = Math.floor(y - BR); r <= Math.floor(y + BR); r++) for (let c = Math.floor(x - BR); c <= Math.floor(x + BR); c++) {
    if (c < 0 || c >= COLS || r < 0 || rowOf(r).t[c] === null) continue;
    const px = Math.max(c, Math.min(x, c + 1)), py = Math.max(r, Math.min(y, r + 1));
    if ((x - px) * (x - px) + (y - py) * (y - py) < BR * BR) return [c, r];
  }
  return null;
}
function strike(c, r) {                       // удар кирки по блоку
  const rw = rowOf(r), t = rw.t[c]; if (!t) return;
  hp -= HIT[t]; rw.h[c]--; snd.dig(); burst(c, r, t);
  if (rw.h[c] <= 0) { rw.t[c] = null; collect(t, r, c); }
  if (hp <= 0 && state === 'mine') { hp = 0; finish(); }
  hud();
}
function physics(dt) {
  dt *= TS;                                    // ускорение игры
  const n = Math.max(1, Math.ceil(Math.hypot(vx, vy) * dt / .06)), h = dt / n;
  for (let i = 0; i < n && state === 'mine'; i++) {
    bx += vx * h;
    if (bx < BR) { bx = BR; vx = Math.abs(vx); } if (bx > COLS - BR) { bx = COLS - BR; vx = -Math.abs(vx); }
    let k = hitCell(bx, by);
    if (k) {                                   // боковой рикошет
      bx -= vx * h; vx = -vx * REST; vy += (Math.random() - .5) * KICK;
      if (Math.abs(vx) < 1.5) vx = (Math.random() < .5 ? -1 : 1) * (1.5 + Math.random() * 2);
      strike(k[0], k[1]);
    }
    vy += G * h; by += vy * h; k = hitCell(bx, by);
    if (k && state === 'mine') {               // вертикальный рикошет
      by -= vy * h; vy = -vy * REST; vx += (Math.random() - .5) * KICK;
      if (vy < 0 && vy > -MINB) vy = -MINB;
      strike(k[0], k[1]);
    }
    vx = Math.max(-VMAX, Math.min(VMAX, vx)); vy = Math.max(-VMAX, Math.min(VMAX, vy));
  }
  ang += vx * dt * .8; life += dt; if (life > 150 && state === 'mine') finish();
}
function finish() {
  state = 'end'; const win = r2(bet * mult); balance = r2(balance + win); save(); upd(); snd.end();
  say(win > 0 ? `Кирка сломалась! Выигрыш: +${win}` : 'Кирка сломалась… ничего не добыто', 2400);
  setTimeout(toIdle, 2500);
}

cv.addEventListener('pointerdown', unlock);

// ---------- рисование ----------
const clouds = [[.15, .12, 1], [.62, .2, .8], [.85, .08, .6]];
function drawWheel() {
  if (wheelA < .02) return;
  const cx = W / 2, cy = H * .34, R = Math.min(W * .28, H * .16);
  ctx.save(); ctx.globalAlpha = wheelA;
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.13, 0, 7); ctx.fillStyle = '#262b45'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#5c6590'; ctx.stroke();
  for (let i = 0; i < WHEEL.length; i++) {
    const a0 = theta + i * SEG, k = WHEEL[i];
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + SEG); ctx.closePath();
    ctx.fillStyle = k === 'x' ? '#8c1d1d' : TIER[k].c; ctx.fill(); ctx.strokeStyle = '#1b1f33'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + SEG / 2); ctx.translate(R * .66, 0); ctx.rotate(Math.PI / 2);
    if (k === 'x') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-9, -9); ctx.lineTo(9, 9); ctx.moveTo(9, -9); ctx.lineTo(-9, 9); ctx.stroke(); }
    else drawPick(0, 0, R * .17, '#1d1d2b', '#3b2a1a', 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R * .16, 0, 7); ctx.fillStyle = '#15151c'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - 13, cy - R * 1.2); ctx.lineTo(cx + 13, cy - R * 1.2); ctx.lineTo(cx, cy - R * .93); ctx.closePath(); ctx.fillStyle = '#ff4d4d'; ctx.fill();
  ctx.restore();
}
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6fb7f5'); g.addColorStop(1, '#cfe9ff'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; clouds.forEach(([x, y, s]) => { ctx.beginPath(); ctx.ellipse(x * W, y * H, 50 * s, 18 * s, 0, 0, 7); ctx.ellipse(x * W + 30 * s, y * H + 6, 38 * s, 15 * s, 0, 0, 7); ctx.fill(); });
  const r0 = Math.max(0, Math.floor(cam / bs) - 1), r1 = Math.ceil((cam + H) / bs);
  for (let r = r0; r <= r1; r++) {
    const rw = rowOf(r), y = r * bs - cam;
    for (let c = 0; c < COLS; c++) { if (rw.t[c]) drawBlock(c * bs, y, bs, rw.t[c], r, c, rw.h[c]); else { ctx.fillStyle = '#3a2418'; ctx.fillRect(c * bs, y, bs + .5, bs + .5); } }
  }
  if (mined && state !== 'end') drawPickAt(bx * bs, by * bs - cam, bs * .42, TIER[tier].c, ang);
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, 1 - p.t * 1.6); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y - cam, p.s, p.s); }); ctx.globalAlpha = 1;
  fx.forEach(f => { ctx.globalAlpha = Math.max(0, 1 - f.t * 2); ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.arc(f.x, f.y - cam, bs * (.6 + f.t * 2.4), 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `800 ${bs * .34}px sans-serif`;
  texts.forEach(t => { ctx.globalAlpha = Math.max(0, 1 - t.t * .8); ctx.lineWidth = 4; ctx.strokeStyle = '#000a'; ctx.fillStyle = t.col; const y = t.y - cam - t.t * 50; ctx.strokeText(t.txt, t.x, y); ctx.fillText(t.txt, t.x, y); }); ctx.globalAlpha = 1;
  drawWheel();
}
function drawPickAt(x, y, s, col, rot) { drawPick(x, y, s, col, '#6b4423', rot); }

let last = performance.now();
function update(dt) {
  if (state === 'spin') {
    spinT += dt; const p = Math.min(1, spinT / SPIN_DUR), th = th0 + (th1 - th0) * (1 - Math.pow(1 - p, 3));
    if (Math.floor(th / SEG) !== Math.floor(theta / SEG)) snd.tick(); theta = th; if (p >= 1) spinDone();
  }
  if (state === 'mine') physics(dt);
  wheelA += ((showWheel ? 1 : 0) - wheelA) * Math.min(1, dt * 5);
  const tgt = mined ? by * bs - H * .36 : -H * .58; cam += (tgt - cam) * Math.min(1, dt * 6);
  parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.vy += 600 * dt; p.y += p.vy * dt; }); parts = parts.filter(p => p.t < .7);
  fx.forEach(f => f.t += dt); fx = fx.filter(f => f.t < .5);
  texts.forEach(t => t.t += dt); texts = texts.filter(t => t.t < 1.2);
}
function frame(now) { const dt = Math.min((now - last) / 1000, .05); last = now; update(dt); draw(); requestAnimationFrame(frame); }
